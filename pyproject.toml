[project]
name = "codex-mcp-dsh"
version = "0.1.0"
description = "Call the local DeepSeek Harness (dsh) from Codex over MCP; also serves it over A2A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.2.1",
    "mcp>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
dsh-a2a = "dsh_mcp:main"
dsh-mcp = "dsh_mcp.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

# The distribution is named for the repo (codex-mcp-dsh); the import package
# stays short (dsh_mcp), so the module name is declared explicitly.
[tool.uv.build-backend]
module-name = "dsh_mcp"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
